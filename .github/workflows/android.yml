name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets
        run: |
          mkdir -p build/www
          cp index.html app.js firebase-config.js build/www/

      - name: Create Capacitor Android project
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Zurmelibble com.hzurmely.zurmelibble --web-dir www
          npx cap add android
          # Location permissions for clock in/out geolocation
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -n permission android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Zurmelibble.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zurmelibble-apk
          path: Zurmelibble.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zurmelibble build ${{ github.run_number }}
          body: Android APK built from ${{ github.sha }}. Download Zurmelibble.apk below and install it on your phone.
          files: Zurmelibble.apk
          make_latest: true
