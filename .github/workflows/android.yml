name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets
        run: |
          mkdir -p build/www
          cp -r index.html app.js firebase-config.js brands vendor build/www/

      - name: Create Capacitor Android project
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Zurmelibble com.hzurmely.zurmelibble --web-dir www
          npx cap add android
          # Location permissions for clock in/out geolocation
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -n permission android/app/src/main/AndroidManifest.xml

      - name: Version and signing key
        working-directory: build/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          # Every build must be signed with the same key, or phones refuse to update the app.
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the ANDROID_DEBUG_KEYSTORE repository secret (see README)"; exit 1; fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          # A higher version code on every build so Android installs it as an update.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -nE "versionCode|versionName" app/build.gradle

      - name: Build APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Zurmelibble.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zurmelibble-apk
          path: Zurmelibble.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zurmelibble build ${{ github.run_number }}
          body: Android APK version 1.0.${{ github.run_number }}, built from ${{ github.sha }}. Download Zurmelibble.apk below and open it on your phone to install or update.
          files: Zurmelibble.apk
          make_latest: true
